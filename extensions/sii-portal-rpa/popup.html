<!doctype html>
<html lang="es">

            <small id="sii-detail">Leyendo estado local.</small>
          </div>
        </div>
        <div class="modulo">
          <span class="dot dot-idle" id="simpleapi-dot"></span>
          <div class="modulo-body">
            <strong>Facturas 33 / 34</strong>
            <span class="state" id="simpleapi-text">Comprobando…</span>
            <small id="simpleapi-detail">Leyendo estado local.</small>
          </div>
        </div>
      </section>
      <button type="button" id="open-options">Abrir configuración</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
